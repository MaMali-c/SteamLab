name: Verify termoyazd (never deploy)
on:
  push:
    branches: [main, termoyazd-source]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    defaults:
      run:
        working-directory: termoyazd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: termoyazd/frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-ci.txt
      - run: python -m pytest -q
        working-directory: termoyazd/backend
      - run: npm ci
        working-directory: termoyazd/frontend
      - run: npm run build
      - run: node scripts/verify-browser-engine.mjs
      - name: Real production API and React integration
        shell: bash
        run: |
          TERMOYAZD_ENV=production TERMOYAZD_ALLOWED_HOSTS=localhost,127.0.0.1 TERMOYAZD_CORS_ORIGINS=https://professor.example.org \
            python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 18743 --no-proxy-headers > /tmp/termoyazd-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18743/api/health >/dev/null; then break; fi
            sleep 0.25
          done
          python scripts/production_smoke.py --api http://127.0.0.1:18743 --origin https://professor.example.org
          TERMOYAZD_TEST_API=http://127.0.0.1:18743 npm --prefix frontend test
      - name: Remote API build
        run: npm --prefix frontend run build
        env:
          VITE_BROWSER_ENGINE: 'false'
          VITE_API_BASE_URL: https://api.example.org
